<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        header, footer {
            background: #202779; color: white; text-align: center;
            padding: 15px; max-width: 700px; margin: 10px auto;
        }
        main { max-width: 520px; margin: auto; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #999; padding: 8px; text-align: left; }
        th { background: #e8eaf5; }
        fieldset { margin-top: 15px; }
        label { display: block; margin-top: 12px; }
        input, select, textarea { margin-top: 5px; max-width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr><th scope="col">Course</th><th scope="col">Seats</th><th scope="col">Fees</th></tr>
            </thead>
            <tbody>
                <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
                <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
            </tbody>
        </table>

        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>

                <label for="student-name">Name:</label>
                <input type="text" id="student-name" name="name" required>

                <label for="student-email">Email:</label>
                <input type="email" id="student-email" name="email" required>

                <label for="student-course">Course:</label>
                <select id="student-course" name="course" required>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                </select>

                <label for="statement">Statement:</label>
                <textarea id="statement" name="statement" rows="5" cols="40"></textarea>

                <p><button type="submit">Apply</button></p>
            </fieldset>
        </form>
    </main>

    <footer>&copy; 2026 ABC College</footer>
</body>
</html>
